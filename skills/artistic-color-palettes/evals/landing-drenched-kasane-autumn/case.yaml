schema_version: "1.1"
name: landing-drenched-kasane-autumn
expected_outcome: |
  The pinned palette is honoured: the data id kasane-kurenai-momiji (Kurenai momiji, scarlet autumn maple; hitoe kurenai #C91F37, layers asaki ao, koki ao, ki, asaki kuchiba, kurenai), labelled "Kasane no irome: Kurenai momiji (Heian court colour layering; hex values are interpretations)". No candidate round and no wait for a choice, because the user pinned the pattern.

  The run infers Persuade mode with a Drenched strategy (the surface is the colour, poster-like), maps roles the kasane way (hitoe as the edge/accent colour at 5-10%, layers as the surface ramp in order, palest layer as ground or text-on-colour), and avoids the anti-clichés (no Rising Sun rays or imperial motifs, no cream-paper-and-red-circle default; maple/lantern imagery is fine). It builds OKLCH ramps and two-tier tokens, measures contrast (WCAG 2 and APCA) for every text/surface pair, fixes failures by moving lightness only and reports before/after (for example mid-lightness greens and the saturated scarlet behind white text), and composes a dark mode (a separately designed evening scene, not an inversion) with its own measured contrast.

  Files written: DESIGN.md at the project root (frontmatter colors between "# acp:begin tokens" / "# acp:end tokens" and the ## Colors body between "<!-- acp:begin colors v1 -->" / "<!-- acp:end colors -->", including Named Rules naming the strategy Drenched and mode Persuade), design/palette.json, design/tokens.css (primitives, semantic --color-* on :root, a dark scope, alias blocks) and a preview HTML page showing the palette applied in light and dark. The final message summarises palette, roles, proportions, contrast results and adjustments, and does not decide typography or layout beyond what the preview needs.
