schema_version: "1.1"
name: combo-impeccable-landing
# neighbours (local paths for the orchestrator's runs)
#   Impeccable: D:\Code\Skill\artistic-color-palettes\notes\neighbour-skills\impeccable\.claude\skills\impeccable
#   (the CLI run gets them from place-files.sh, fetched at pinned SHAs into .claude/skills/<name>/)
expected_outcome: |
  The pinned plate is honoured: data id wada-122 (Carmine #CC1236, Cream Yellow #FDBF68, Benzol Green #00978D), labelled "Wada plate 122 (*A Dictionary of Color Combinations*, 1933)". Impeccable and this skill are both loaded; the run follows the interop contract. It reads PRODUCT.md first (accessibility: WCAG 2.2 AA, older readers on phones) then the existing DESIGN.md, whose Overview sets mode Persuade. It does not show a candidate round and does not stop for a choice, because the palette is pinned.

  Division of labour: Impeccable owns layout and typography, this skill owns colour only. The run does not choose fonts, spacing or layout for the page, does not rewrite the Overview or Typography text, and does not touch PRODUCT.md or .impeccable/*. It picks a strategy suited to Persuade (Committed, Full palette or Drenched, stated with Impeccable's own names) and maps the three members to roles, with contrast measured for each text/surface pair (WCAG 2 plus APCA) and failures fixed by lightness only, reported before/after (carmine and green are mid-lightness; cream yellow is a light ground or text-on-dark colour).

  Files: DESIGN.md is edited only by inserting the acp marker regions (frontmatter colors between "# acp:begin tokens" and "# acp:end tokens"; a ## Colors section in canonical position with the body between "<!-- acp:begin colors v1 -->" and "<!-- acp:end colors -->"), with all other existing text unchanged; design/palette.json and design/tokens.css are created. The ## Colors region names the strategy and mode (Persuade) in a Named Rule and has no hex that differs from the frontmatter. The final message tells the user to choose merge if Impeccable's document step later asks refresh/overwrite/merge, and may mention the optional CLAUDE.md pointer question (asked once, never written unasked).
context:
  scaffold_script: place-files.sh
