<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Plotwise</title>
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#1e1b4b,#4c1d95);color:#fff}
  header{padding:24px 32px;font-weight:700;font-size:22px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 32px}
  .card{background:rgba(255,255,255,.08);border-radius:20px;padding:20px;box-shadow:0 8px 32px rgba(139,92,246,.35)}
  .card h3{margin:0;font-size:13px;opacity:.7;font-weight:500}
  .card p{margin:8px 0 0;font-size:34px;font-weight:700;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}
  .chart{margin:16px 32px;height:260px;border-radius:20px;background:rgba(255,255,255,.06)}
</style></head>
<body>
<header>Plotwise</header>
<div class="grid">
  <div class="card"><h3>Visitors</h3><p>48,210</p></div>
  <div class="card"><h3>Signups</h3><p>1,904</p></div>
  <div class="card"><h3>Activation</h3><p>38.2%</p></div>
  <div class="card"><h3>MRR</h3><p>$12.4k</p></div>
</div>
<div class="chart"></div>
</body></html>
