schema_version: "1.1"
name: combo-taste-dashboard
# neighbours (local paths for the orchestrator's runs)
#   Taste: D:\Code\Skill\artistic-color-palettes\notes\neighbour-skills\taste-skill\skills\taste-skill
#   (the CLI run gets them from place-files.sh, fetched at pinned SHAs into .claude/skills/<name>/)
expected_outcome: |
  Taste and this skill are both loaded. Taste owns the anti-slop art direction; this skill is the only source of the palette. The key behaviour: exactly one palette set is proposed, from this skill's data, and Taste does not deal a second, competing palette. The run states that Taste is run with palette kept (`--keep palette`, or the equivalent instruction not to deal its own palette) and that exactly one accent is mapped (`--accent` = the palette's --color-accent; extra palette members map to --field-n or stay unused). If a chosen plate contains violet/indigo/purple it notes `--allow palette-purple`; if it is a cream ground with terracotta it notes Taste's inspector will question that and the palette is kept.

  No palette is pinned (the user only says "Wada's book if there's something that works"), so the run shows 3 to 5 candidates from the data (Operate surface, Restrained strategy, likely cool/serene/austere/earthy moods, labelled "Wada plate N (*A Dictionary of Color Combinations*, 1933)" with real plate numbers; not the existing purple-pink gradient) and stops for the user's choice, writing no files. If a run instead continues after proposing a single clearly justified plate, it must still show it as a candidate and ask before applying. The run must not rebuild the page with Taste-dealt colours, must not keep the purple/pink gradient as an accent, and must not propose more than one accent in the dashboard plan.

  The final message may summarise Taste's non-colour moves at a high level (type, density, hierarchy) but leaves them to Taste.
context:
  scaffold_script: place-files.sh
